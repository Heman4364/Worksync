name: WorkSync CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 3. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 4. Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 5. Run Frontend Unit Tests (Vitest & RTL)
        working-directory: frontend
        run: npm test

      - name: 6. Build Frontend Bundle (Vite)
        working-directory: frontend
        run: npm run build

      - name: 7. Run Backend Unit & Integration Tests
        working-directory: backend
        run: mvn clean verify

      - name: 8. Package Spring Boot Artifact
        working-directory: backend
        run: mvn package -DskipTests

      - name: 9. Build Docker Images
        run: |
          docker build -t worksync-backend:latest -f Dockerfile.backend .
          docker build -t worksync-frontend:latest -f Dockerfile.frontend .
