spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/worksyncdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
  cache:
    jcache:
      config: classpath:ehcache.xml
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reliability-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

worksync:
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      access-token-expiration-ms: 900000       # 15 minutes
      refresh-token-expiration-ms: 604800000   # 7 days
    aes:
      # 256-bit base64-encoded AES key
      secret-key: d29ya3N5bmMtYWVzLTI1Ni1nY20ta2V5LXNlY3JldA==
  kafka:
    topic:
      scheduled-posts: scheduled-posts
      scheduled-posts-dlt: scheduled-posts-dlt
    retry:
      max-attempts: 3
      initial-interval-ms: 2000
      multiplier: 2.0
