services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: worksync-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: worksync-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: worksync-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: worksync-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: worksync-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: worksync-db
          property: password
      - key: WORKSYNC_SECURITY_JWT_SECRET
        generateValue: true

  # 2. React Vite Frontend Static Site
  - type: web
    name: worksync-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: worksync-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# 3. Free Managed PostgreSQL Database
databases:
  - name: worksync-db
    plan: free
    region: oregon
    databaseName: worksync
    user: worksync
