services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: worksync-backend
    env: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: worksync-db
          property: connectionString
      - key: WORKSYNC_SECURITY_JWT_SECRET
        generateValue: true

  # 2. React Vite Frontend Static Site
  - type: web
    name: worksync-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: worksync-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# 3. Free Managed PostgreSQL Database
databases:
  - name: worksync-db
    plan: free
    region: oregon
    databaseName: worksync
    user: worksync
